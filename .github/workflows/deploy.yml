name: Deploy SalesVince API

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: salesvince-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install SSH Password Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy to DigitalOcean VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'

            set -e

            echo "=============================="
            echo "SalesVince API Deployment"
            echo "=============================="

            cd "${{ secrets.APP_DIR }}"

            echo "Current directory:"
            pwd

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            npm ci

            echo "Ensuring Puppeteer Chrome is available..."
            npx puppeteer browsers install chrome

            echo "Installing Chromium runtime libraries (if needed)..."
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq \
                ca-certificates \
                fonts-liberation \
                libasound2 \
                libatk-bridge2.0-0 \
                libatk1.0-0 \
                libcairo2 \
                libcups2 \
                libdbus-1-3 \
                libgbm1 \
                libglib2.0-0 \
                libgtk-3-0 \
                libnspr4 \
                libnss3 \
                libpango-1.0-0 \
                libx11-6 \
                libxcomposite1 \
                libxdamage1 \
                libxext6 \
                libxfixes3 \
                libxrandr2 \
                libxrender1 \
                libxss1 \
                libxtst6 \
                xdg-utils || true
            fi

            export PUPPETEER_NO_SANDBOX=true

            echo "Building NestJS..."
            NODE_OPTIONS="--max-old-space-size=2048" npm run build

            echo "Restarting PM2..."
            pm2 restart api-salesvince --update-env

            echo "=============================="
            echo "Deployment Successful ✅"
            echo "=============================="

          EOF